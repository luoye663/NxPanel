name: Sign Nginx module index

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open NxPanel PR number (from a branch in this repository to main)
        required: true
        type: number
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'nginx-module-index-sign' || format('nginx-module-index-check-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: pr
        name: Record the PR head for review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: bash scripts/nginx-module-index.sh prepare

  sign-index:
    needs: prepare
    name: 'Sign PR #${{ inputs.pr_number }} at ${{ needs.prepare.outputs.head_sha }}'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: module-signing
    permissions:
      contents: write
      pull-requests: read
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      REVIEWED_BASE: ${{ needs.prepare.outputs.base_sha }}
      REVIEWED_HEAD: ${{ needs.prepare.outputs.head_sha }}
      REVIEWED_REF: ${{ needs.prepare.outputs.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Read the reviewed index without checking out the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/nginx-module-index.sh read-reviewed
      - name: Sign the module index
        env:
          NXPANEL_MODULE_TRUST_KEYS: ${{ vars.NXPANEL_MODULE_TRUST_KEYS }}
          NXPANEL_MODULE_SIGNING_KEYS: ${{ secrets.NXPANEL_MODULE_SIGNING_KEYS }}
          NXPANEL_UPDATE_TRUST_KEYS: ${{ vars.NXPANEL_UPDATE_TRUST_KEYS }}
        run: |
          work="$RUNNER_TEMP/nginx-module-index"
          go run ./cmd/nxpanel-module-catalog -sign-index -input "$work/proposed/modules.json" \
            -output "$work/signed" -base-index-dir "$work/base"
      - name: Append the signature to the same PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/nginx-module-index.sh publish

  check-index:
    if: github.event_name == 'pull_request'
    name: Nginx module index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - id: index
        name: Read index files from the proposed merge
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          path=catalog/nginx-modules
          gh auth setup-git
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git show -s --format=%P "$GITHUB_SHA")" == "$BASE_SHA $PR_HEAD_SHA" ]]
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- "$path/modules.json" "$path/modules.sig.json"; then
            exit 0
          fi
          if [[ ! -f scripts/nginx-module-index.sh ]]; then
            if git cat-file -e "$BASE_SHA:$path/modules.json" 2>/dev/null ||
              git cat-file -e "$BASE_SHA:$path/modules.sig.json" 2>/dev/null ||
              git cat-file -e "$GITHUB_SHA:$path/modules.sig.json" 2>/dev/null; then
              echo 'The trusted main verifier is missing; only an initial empty index is allowed.' >&2
              exit 1
            fi
            empty_blob=$(printf '[]\n' | git hash-object --stdin)
            [[ "$(git ls-tree "$GITHUB_SHA" -- "$path/modules.json")" == "100644 blob $empty_blob"$'\t'"$path/modules.json" ]]
            exit 0
          fi
          bash scripts/nginx-module-index.sh read-check "$BASE_SHA" "$GITHUB_SHA"
          echo 'verify=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        if: steps.index.outputs.verify == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify main and the proposed index with public keys
        if: steps.index.outputs.verify == 'true'
        env:
          NXPANEL_MODULE_TRUST_KEYS: ${{ vars.NXPANEL_MODULE_TRUST_KEYS }}
          NXPANEL_UPDATE_TRUST_KEYS: ${{ vars.NXPANEL_UPDATE_TRUST_KEYS }}
        run: |
          work="$RUNNER_TEMP/nginx-module-index"
          go run ./cmd/nxpanel-module-catalog -check-index -input "$work/proposed" -base-index-dir "$work/base"
