name: Publish Nginx module release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the staged public prerelease
        required: true
        type: string
      candidate_sha256:
        description: Reviewed SHA-256 of candidate.json
        required: true
        type: string
      runtime_images:
        description: JSON array of digest-pinned verification images
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nginx-module-release
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tools_ref: ${{ steps.tools.outputs.ref }}
      architectures: ${{ steps.targets.outputs.architectures }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: module
          persist-credentials: false
      - id: tools
        name: Read the reviewed NxPanel tools pin
        run: |
          set -euo pipefail
          pin=module/.github/nxpanel-tools.sha
          if [[ ! -f "$pin" || -L "$pin" ]]; then
            echo 'Expected a checked-in .github/nxpanel-tools.sha file; use the pinned template from the NxPanel maintainers.' >&2
            exit 1
          fi
          tools_ref=$(<"$pin")
          if [[ ! "$tools_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo '.github/nxpanel-tools.sha must contain one full NxPanel commit SHA.' >&2
            exit 1
          fi
          printf 'ref=%s\n' "$tools_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: luoye663/NxPanel
          ref: ${{ steps.tools.outputs.ref }}
          path: nxpanel
          persist-credentials: false
      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_REPO: ${{ github.repository }}
          ASSET_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
          RUNTIME_IMAGES: ${{ inputs.runtime_images }}
        run: |
          set -euo pipefail
          [[ "$ASSET_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$ ]]
          gh release view "$ASSET_TAG" -R "$ASSET_REPO" --json isPrerelease,isDraft | jq -e '.isPrerelease and (.isDraft | not)'
          bash nxpanel/scripts/nginx-module-smoke/fetch-candidate.sh "$ASSET_REPO" "$ASSET_TAG" "$CANDIDATE_SHA" module-candidate
          architectures=$(jq -cer '[.assets[].target.arch] | unique | select(length > 0 and all(.[]; IN("amd64", "arm64")))' module-candidate/candidate.json)
          jq -e --argjson arch "$architectures" '[.[].arch] | unique == $arch' <<< "$RUNTIME_IMAGES"
          printf 'architectures=%s\n' "$architectures" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: module-candidate
          path: |
            module-candidate/candidate.json
            module-candidate/*.sh
            module-candidate/*.so
          if-no-files-found: error

  verify:
    needs: fetch
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.fetch.outputs.architectures) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: luoye663/NxPanel
          ref: ${{ needs.fetch.outputs.tools_ref }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: module-candidate
          path: module-candidate
      - name: Verify install and uninstall on every target
        env:
          RUNTIME_IMAGES: ${{ inputs.runtime_images }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/nginx-module-smoke/verify-candidate.sh module-candidate "$RUNTIME_IMAGES" "$ARCH"

  sign:
    needs: [fetch, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: module-release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: luoye663/NxPanel
          ref: ${{ needs.fetch.outputs.tools_ref }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: module-candidate
          path: module-candidate
      - name: Download the public NxPanel policy
        run: bash scripts/fetch-nxpanel-trust.sh "$RUNNER_TEMP/nxpanel-trust"
      - name: Sign the tested assets without running them
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
          NXPANEL_ROOT_PUBLIC_KEY: ${{ vars.NXPANEL_ROOT_PUBLIC_KEY }}
          NXPANEL_MODULE_RELEASE_SIGNING_KEYS: ${{ secrets.NXPANEL_MODULE_RELEASE_SIGNING_KEYS }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  module-candidate/candidate.json\n' "$CANDIDATE_SHA" | sha256sum -c --status
          go run ./cmd/nxpanel-module-catalog -candidate -trust-dir "$RUNNER_TEMP/nxpanel-trust" -input module-candidate -output module-release
      - name: Publish the signed release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_REPO: ${{ github.repository }}
          ASSET_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          gh release view "$ASSET_TAG" -R "$ASSET_REPO" --json isPrerelease,isDraft | jq -e '.isPrerelease and (.isDraft | not)'
          bash scripts/nginx-module-smoke/fetch-candidate.sh "$ASSET_REPO" "$ASSET_TAG" "$CANDIDATE_SHA" staged-candidate
          gh release upload "$ASSET_TAG" -R "$ASSET_REPO" module-release/module-release{,.sig}.json
          gh release edit "$ASSET_TAG" -R "$ASSET_REPO" --prerelease=false --latest
